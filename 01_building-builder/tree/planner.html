<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外構プランナー | Three.js</title>
<style>
  :root{
    --panel: rgba(24,26,29,0.90);
    --line:  rgba(255,255,255,0.13);
    --text:  #e9ecef;
    --sub:   #9aa3ab;
    --accent:#ff8a3d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif; }
  #canvas-container{ position:fixed; inset:0; }
  canvas{ display:block; }

  .panel{
    position:fixed; top:12px; width:212px; max-height:calc(100vh - 24px);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; backdrop-filter:blur(8px); display:flex; flex-direction:column;
    box-shadow:0 8px 26px rgba(0,0,0,0.35); font-size:12px; z-index:5;
  }
  #palette{ left:12px; }
  #inspector{ right:12px; width:232px; }
  .panel header{ display:flex; align-items:center; justify-content:space-between;
    padding:9px 11px; border-bottom:1px solid var(--line); }
  .panel h1{ font-size:13px; margin:0; font-weight:600; letter-spacing:.02em; }
  .toggle{ background:none; border:none; color:var(--sub); font-size:15px; cursor:pointer; line-height:1; }
  .panel .body{ overflow-y:auto; padding:9px 11px 12px; }
  .panel.collapsed .body{ display:none; }

  /* 大分類タブ */
  #groups{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .tab{ flex:1 1 auto; padding:5px 6px; font-size:11.5px; color:var(--sub);
    background:rgba(255,255,255,0.05); border:1px solid transparent; border-radius:6px; cursor:pointer; }
  .tab.on{ color:#fff; background:rgba(255,138,61,0.20); border-color:rgba(255,138,61,0.55); }

  /* 地物 */
  #items{ display:flex; flex-direction:column; gap:4px; }
  .item{ display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:7px 9px; font-size:12px; color:var(--text); text-align:left;
    background:rgba(255,255,255,0.05); border:1px solid transparent; border-radius:6px; cursor:pointer; }
  .item:hover{ background:rgba(255,255,255,0.10); }
  .item.on{ background:rgba(255,138,61,0.22); border-color:rgba(255,138,61,0.6); }
  .item em{ font-style:normal; font-size:10px; color:var(--sub);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px; }

  /* 編集 */
  .ehead{ display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:7px; margin-bottom:7px; border-bottom:1px solid var(--line); }
  .ehead b{ font-size:12.5px; }
  .ehead span{ font-size:10.5px; color:var(--sub); }
  .row{ margin-bottom:9px; }
  .lbl{ display:flex; justify-content:space-between; gap:6px; font-size:11.5px; color:var(--sub); margin-bottom:3px; }
  .val{ color:var(--text); }
  input[type=range]{ width:100%; height:16px; -webkit-appearance:none; background:none; }
  input[type=range]::-webkit-slider-runnable-track{ height:3px; background:rgba(255,255,255,0.20); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; margin-top:-4.5px;
    background:var(--accent); border-radius:50%; cursor:pointer; }
  select{ width:100%; padding:4px 6px; font-size:11.5px; color:var(--text);
    background:rgba(255,255,255,0.07); border:1px solid var(--line); border-radius:5px; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text); margin-bottom:8px; cursor:pointer; }
  .seg{ display:flex; align-items:center; gap:5px; margin-bottom:10px; }
  .seg button{ padding:4px 10px; font-size:11.5px; color:var(--sub);
    background:rgba(255,255,255,0.06); border:1px solid var(--line); border-radius:5px; cursor:pointer; }
  .seg button.on{ color:#fff; background:rgba(255,138,61,0.22); border-color:rgba(255,138,61,0.6); }
  .seg span{ font-size:10.5px; color:var(--sub); }
  .btns{ display:flex; gap:6px; margin-top:10px; }
  .act{ flex:1; padding:6px; font-size:11.5px; color:var(--text);
    background:rgba(255,255,255,0.08); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .act:hover{ background:rgba(255,255,255,0.14); }
  .act.danger:hover{ background:rgba(220,80,60,0.35); }
  .empty{ color:var(--sub); font-size:11.5px; line-height:1.7; text-align:center; margin:14px 0; }

  #hint{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:11.5px; z-index:5; white-space:nowrap; }
  #status{ position:fixed; right:12px; bottom:12px; color:#4a5157; font-size:11px; z-index:5; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="canvas-container"></div>

<div class="panel" id="palette">
  <header><h1>地物を選ぶ</h1><button class="toggle">−</button></header>
  <div class="body">
    <div id="groups"></div>
    <div id="items"></div>
    <div class="btns">
      <button class="act" id="btn-cancel" style="display:none">作図をやめる</button>
      <button class="act danger" id="btn-clear">全消去</button>
    </div>
  </div>
</div>

<div class="panel" id="inspector">
  <header><h1>編集</h1><button class="toggle">−</button></header>
  <div class="body" id="edit"></div>
</div>

<div id="hint">ドラッグ:回転　ホイール:ズーム　右ドラッグ:平行移動　／　地物をクリックで編集</div>
<div id="status"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
