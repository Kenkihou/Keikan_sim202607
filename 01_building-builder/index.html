<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>（仮称）景観検討シミュレーター</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-family: sans-serif;
            pointer-events: none;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            z-index: 10;
        }
        
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 13px;
            pointer-events: none;
            white-space: pre-line; 
            z-index: 100;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        .lil-gui {
            --font-size: 14px;
            --input-font-size: 14px;
            --widget-height: 28px;
            --name-width: 40%;
            --folder-indent: 10px;
        }

        .tool-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .tool-btn {
            flex: 1; text-align: center; background: #3a3a3a; color: #ccc;
            padding: 8px 0; border-radius: 3px; cursor: pointer; font-size: 13px;
            font-weight: bold; border: 1px solid #222; user-select: none;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: #4a4a4a; color: #fff; }
        .tool-btn.active { background: #007acc; color: white; border-color: #005a9e; }

        .action-row { display: flex; gap: 5px; margin-top: 5px; }
        .action-btn {
            flex: 1; text-align: center; background: #555; color: white;
            padding: 6px 0; border-radius: 3px; cursor: pointer; font-size: 13px;
            user-select: none;
        }
        .action-btn:hover { background: #666; }
        .action-btn:active { background: #444; }
        .action-btn.disabled { opacity: 0.3; pointer-events: none; }

        #floating-menu {
            position: absolute;
            display: none; /* 初期は非表示 */
            flex-direction: column;
            gap: 5px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
            z-index: 200;
        }

        .float-btn {
            background: #007acc; color: white; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            font-size: 13px; font-weight: bold; text-align: center;
            user-select: none;
        }
        .float-btn:hover { background: #005a9e; }
        .float-btn.danger { background: #d9534f; }
        .float-btn.danger:hover { background: #c9302c; }
        /* 既存の .float-btn 類に追加・修正 */
        .float-btn.warning { background: #f0ad4e; color: white; } /* 黄色：変更用 */
        .float-btn.warning:hover { background: #ec971f; }
        .float-btn.black { background: #000000; color: #ffffff; } /* 黒色：プッシュプル用 */
        .float-btn.black:hover { background: #333333; }

        #main-toolbar {
            position: absolute;
            bottom: 100px; 
            left: 50%;
            transform: translateX(-50%); 
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 6px;
            z-index: 100;
            border: 1px solid #ccc;
            align-items: center;
        }

        .toolbar-btn {
            position: relative;
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ccc;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap; 
            flex-shrink: 0;      
        }

        .toolbar-btn:hover { background: #e2e6ea; }
        .toolbar-btn.active { background: #007acc; color: white; border-color: #005a9e; }
        .toolbar-btn.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .toolbar-btn.danger { background: #fff; color: #d9534f; }
        .toolbar-btn.danger:hover { background: #d9534f; color: white; border-color: #d9534f; }

        .toolbar-divider { width: 1px; height: 24px; background: #ccc; margin: 0 2px; flex-shrink: 0; }

        /* ==========================================================================
           ★追加：外構作図モードのパネル（tree/planner.html の黒パネルを、
           本体アプリの白い UI に合わせて作り直したもの）
           ========================================================================== */
        .ext-panel {
            position: absolute;
            top: 12px;
            width: 230px;
            /* 下端は「下部の操作バー（時刻・切り抜き）＋ツールバー」に被らない高さで止める */
            max-height: calc(100vh - 200px);
            background: rgba(255, 255, 255, 0.96);
            color: #333;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 100;
        }
        /* 左上には「🏠 ポータルに戻る」ボタンがあるので、その下から始める */
        #ext-palette { left: 12px; top: 76px; max-height: calc(100vh - 264px); }
        /* ※ 表示・非表示は JS（ui.js）が style.display で切り替えるので、
              ここでは指定しない（初期状態は要素側の inline style で none） */
        #ext-inspector { right: 12px; width: 248px; }

        .ext-panel header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border-bottom: 1px solid #e5e5e5;
        }
        .ext-panel h1 { font-size: 13px; margin: 0; font-weight: 700; }
        .ext-toggle { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; line-height: 1; }
        .ext-panel .ext-body { overflow-y: auto; padding: 9px 10px 11px; }
        .ext-panel.collapsed .ext-body { display: none; }

        /* 大分類タブ */
        #ext-groups { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .ext-tab {
            flex: 1 1 auto; padding: 5px 6px; font-size: 11.5px; color: #555;
            background: #f1f3f5; border: 1px solid #dee2e6; border-radius: 5px; cursor: pointer;
        }
        .ext-tab:hover { background: #e2e6ea; }
        .ext-tab.on { color: #fff; background: #007acc; border-color: #005a9e; }

        /* 地物 */
        #ext-items { display: flex; flex-direction: column; gap: 4px; }
        .ext-item {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 7px 9px; font-size: 12px; color: #333; text-align: left;
            background: #f8f9fa; border: 1px solid #e3e3e3; border-radius: 5px; cursor: pointer;
        }
        .ext-item:hover { background: #e2e6ea; }
        .ext-item.on { background: #e6f2fb; border-color: #007acc; color: #005a9e; font-weight: 700; }
        .ext-item em {
            font-style: normal; font-size: 10px; color: #888;
            border: 1px solid #ddd; border-radius: 4px; padding: 1px 4px;
        }

        /* 編集パネル */
        .ext-ehead {
            display: flex; align-items: baseline; justify-content: space-between;
            padding-bottom: 7px; margin-bottom: 8px; border-bottom: 1px solid #e5e5e5;
        }
        .ext-ehead b { font-size: 12.5px; }
        .ext-ehead span { font-size: 10.5px; color: #888; }
        .ext-row { margin-bottom: 9px; }
        .ext-lbl { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: #777; margin-bottom: 3px; }
        .ext-val { color: #333; font-weight: 600; }
        .ext-panel input[type=range] { width: 100%; height: 18px; accent-color: #007acc; }
        .ext-panel select {
            width: 100%; padding: 4px 6px; font-size: 11.5px; color: #333;
            background: #fff; border: 1px solid #ccc; border-radius: 4px;
        }
        .ext-chk { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #333; margin-bottom: 8px; cursor: pointer; }
        .ext-seg { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
        .ext-seg button {
            padding: 4px 10px; font-size: 11.5px; color: #555;
            background: #f1f3f5; border: 1px solid #dee2e6; border-radius: 5px; cursor: pointer;
        }
        .ext-seg button.on { color: #fff; background: #007acc; border-color: #005a9e; }
        .ext-seg span { font-size: 10.5px; color: #999; }
        .ext-btns { display: flex; gap: 6px; margin-top: 10px; }
        .ext-act {
            flex: 1; padding: 6px; font-size: 11.5px; color: #333;
            background: #f1f3f5; border: 1px solid #ccc; border-radius: 5px; cursor: pointer;
        }
        .ext-act:hover { background: #e2e6ea; }
        .ext-act.danger { color: #d9534f; }
        .ext-act.danger:hover { background: #d9534f; color: #fff; border-color: #d9534f; }
        .ext-act.primary { background: #007acc; color: #fff; border-color: #005a9e; margin-top: 6px; width: 100%; }
        .ext-act.primary:hover { background: #005a9e; }

        /* 操作の案内は画面上端の中央に置く（下部は時刻・切り抜きスライダーで埋まっているため） */
        #ext-hint {
            position: absolute; left: 50%; transform: translateX(-50%); top: 12px;
            background: rgba(255, 255, 255, 0.96); color: #333;
            border: 1px solid #ccc; border-radius: 6px; padding: 6px 14px;
            font-family: sans-serif; font-size: 11.5px; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); z-index: 100; pointer-events: none;
        }
        #ext-status {
            position: absolute; right: 14px; bottom: 8px;
            font-family: sans-serif; font-size: 11px; color: #999; z-index: 100; pointer-events: none;
        }

        /* ==========================================================================
           ★変更・追加：汎用ラジカセ風物理ボタンシステム（立体感＋LEDランプ）
           ========================================================================== */
        .sim-panel-btn {
            /* ★変更：ベースを少し明るいメタリック調のグレーに変更 */
            background: #4e4e5e;
            color: #ffffff;
            /* ★変更：黒地からボタンを浮き立たせるための少し明るい境界線 */
            border: 1px solid #666677;
            /* ★変更：下側のベゼル（厚み）を明るいグレーにして、光が当たっている立体感を強調 */
            border-bottom: 4px solid #7a7a8a; 
            width: 44px;
            height: 44px;
            display: flex;
            flex-direction: column;           /* LEDとアイコンを縦に綺麗に並べるため */
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1); /* カチカチ感を出すため少し速く */
            flex-shrink: 0;
            position: relative;
            /* ★変更：黒地のコンテナの上でもボタンの存在がわかるよう、少し濃いめのクッキリした影を配置 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6); 
            padding-top: 6px;                  /* 上部のLEDスペースを考慮した内側余白 */
            box-sizing: border-box;
        }
        
        .sim-panel-btn:hover { 
            /* ★変更：ホバー時はボタンのトップ面だけが明るくなるように */
            background: #5d5d6d; 
            border-color: #777788; 
        }

        /* 物理ボタン上部の汎用ミニLEDランプ */
        .led-lamp {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            /* ★変更：グレーのボタンの上でランプの「穴」がはっきり認識できるよう漆黒に */
            background: #111115; 
            border-radius: 50%;
            transition: all 0.1s ease;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.9);
        }

        /* ボタンがON（ラジカセのボタンがカチッとへこんでいる）状態 */
        .sim-panel-btn.active {
            /* ★変更：押し込まれてパネルの奥（影）に入り込んだ質感を出すため、背景色とベゼルをグッと暗く */
            background: #4e4e5e;               
            border-color: #22222d;
            border-bottom: 1px solid #22222d;  /* 厚みが潰れる */
            /* ★変更：ボタンが穴に深く嵌まり込んだような強いインセット陰影 */
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.7); 
            transform: translateY(3px);        /* 厚みが減った分、物理的に下へ3pxカチッと沈み込む */
            padding-top: 9px;                  /* 沈み込んだ際のアイコン位置の微調整 */
            color: #ffffff;
        }

        /* ボタンがONの時のLED点灯エフェクト（クラスを重ねれば他色への応用も可能） */
        .sim-panel-btn.active .led-lamp {
            background: #39ff14; /* 鮮やかな通電ネオングリーンに点灯 */
            box-shadow: 0 0 8px #39ff14, 0 0 3px #39ff14; /* 周辺への発光エフェクト */
        }

        /* ========================================== */
        /* ★追加：スライダーが操作不能（グレーアウト）状態のスタイル */
        /* ========================================== */
        .slider-disabled {
            pointer-events: none !important;
            opacity: 0.3 !important;
        }

        /* ツールチップのデザイン（白ボタン・黒ボタンで共有） */
        .toolbar-btn::after, .sim-panel-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 54px; 
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: sans-serif;
            font-weight: normal;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.15s ease;
            z-index: 110;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .toolbar-btn::before, .sim-panel-btn::before {
            content: "";
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            border-width: 6px 6px 0 6px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.85) transparent transparent transparent;
            pointer-events: none;
            opacity: 0;
            transition: all 0.15s ease;
            z-index: 110;
        }

        .toolbar-btn:hover::after,
        .toolbar-btn:hover::before,
        .sim-panel-btn:hover::after,
        .sim-panel-btn:hover::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================== */
        /* ★変更：画面中央下のタイムスライダーUI (統合パネル化) */
        /* ========================================== */
        #app1-time-slider-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            /* ★変更：右隣に「切り抜き」パネル（240px＋隙間12px）を置くので、その半分だけ
               左へずらして【2枚合わせて画面中央】に見えるようにする。
               ⚠️ 03_night-simulator の時刻パネルは、モデリングから起動したとき
                  この真上に重なる（寸法・位置が同一）ので、あちらも同じだけずらしてある。 */
            transform: translateX(calc(-50% - 126px));
            /* ★変更：上のボタン群の幅に合わせず、文字被りや見切れが起きない幅を自律的に確保。
               地球モードのパネルを並べるぶん、幅は 0.9倍（520→468px）に詰めてある。
               ⚠️ 03 の時刻パネルも同じ寸法にしてあるので、片方だけ変えないこと。 */
            width: auto;
            min-width: 468px;
            background: rgba(15, 15, 25, 0.85);
            /* ★変更：左右の余白を広げ、左端の「陰影なし」の見切れを防ぐ */
            padding: 14px 25px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            z-index: 100000; 
            box-sizing: border-box;
            display: flex;
            align-items: center;
            /* 左端のアイコンとスライダーの間が空きすぎないよう詰める。
               右のパレットボタンとの間隔は、ボタン側の margin-left で元の広さを保つ。 */
            gap: 12px;
            /* ★追加：起動直後にポータル画面の上へ一瞬映り込むのを防ぐ。
               表示・非表示は setMainAppVisibility が inline style で切り替える。 */
            display: none;
        }

        #app1-munsell-btn {
            margin-left: 12px;   /* 「夜間照明」ラベルとボタンが近づきすぎないように */
        }

        /* ★変更：🎨（マンセルへ）・⛰（断面表示）の2つは、.sim-panel-btn 標準の
           「立体ボタン」見た目（自前の背景・枠線・下側ベゼル・影・角丸）をやめる。
           パネルの端にこのボタンだけ角丸の縁と影が付くと、パネルの中にもう1枚
           ミニパネルが乗っているように見えてしまう（実際にそう見えると指摘された）。
           枠を持たない、周りの黒パネルにそのまま溶け込むアイコンボタンにする。
           ⚠️ .sim-panel-btn 本体のクラス（indicator の🌃・🌐ランプ）は変えない。
             あちらは操作不能な表示灯で、押しボタンの立体感がむしろ「操作できない
             もの」と視覚的に区別する役目を持っているため。 */
        #app1-munsell-btn,
        #app1-profile-toggle,
        #app1-streetview-toggle {
            background: transparent;
            border: none;
            border-bottom: none;
            box-shadow: none;
            border-radius: 8px;
        }
        #app1-munsell-btn:hover,
        #app1-profile-toggle:hover,
        #app1-streetview-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: transparent;
        }
        /* ON状態は「枠で囲む」のではなく、背景をうっすら光らせるだけにする
           （枠付きの立体表現は使わない＝押し込みアニメーションもここでは無し）。 */
        #app1-munsell-btn.active,
        #app1-profile-toggle.active,
        #app1-streetview-toggle.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: transparent;
            box-shadow: none;
            transform: none;
            padding-top: 6px;
        }

        .slider-ui-inner {
            position: relative;
            flex-grow: 1;
            /* ★追加：ラベル文字（陰影なし / 夜間照明）が左右に広がった際、コンテナやボタンと被らないよう安全地帯を作る */
            margin: 0 25px 0 25px;
        }

        /* パネル左端に置く「どのシミュレーターか」を示す表示灯 兼 オンオフボタン。
           見た目は🎨ボタンと同じラジカセ風。スライダーが 0 より動く＝そのモードが動いている
           間だけ .active を付けてランプを灯す。
           ★以前は「操作するものではない」表示灯だったので cursor:default／ホバー無反応に
             していたが、押してオンオフできるようにしたので、その打ち消しは外してある
             （.sim-panel-btn 標準のカーソルとホバーがそのまま効く）。 */

        .slider-labels-wrapper {
            position: relative;
            width: 100%;
            height: 18px; 
            margin-bottom: 8px; 
        }
        .slider-labels-wrapper span {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            white-space: nowrap;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 16px; 
            display: flex;
            align-items: center;
        }

        .slider-rail-bg {
            position: absolute;
            left: -8px;
            right: -8px;
            height: 4px; 
            background: #2a2a3a;
            border-radius: 2px;
            pointer-events: none;
            z-index: 1;
        }

        /* ==========================================
           ★追加：地球モードの「切り抜き」スライダー（時刻スライダーとは別パネル）
           ==========================================
           時刻パネル（min-width 520px・中央寄せ）の右隣に、同じ見た目で並べる。
           ※ 時刻パネルの寸法は 03_night-simulator の同じパネルと揃えてあるので触らない。
             こちらの left は「画面中央 ＋ 時刻パネルの半分(260px) ＋ 隙間(12px)」で決めている。
           ★ 断面（東西30km）のオン・オフボタンも、このパネルの中の3人目のボタンとして
             同じ枠に収めてある（🌐ランプ・スライダー・断面ボタンで1枚の黒モーダル）。
             幅 296px は 240px（従来）＋ gap12px＋ボタン44px の合計。
             断面パネル（04側）を開いても、この配置・幅は【変えない】
             （以前は断面表示中だけ幅いっぱいに広げて時刻パネルを隠す作りにしていたが、
             「01の配置から変えないでほしい」という要望で撤回した）。
           ★ 時刻パネルとこのパネルは【別の黒モーダルのまま】でよい（隙間12pxを空けて
             隣に並べるだけ）。1枚に融合してほしいのではなく、各パネルの中で
             🎨・⛰ボタンが「ミニパネル」に見えるのが不要、という指摘だったため
             （対応は #app1-munsell-btn / #app1-profile-toggle 側の見た目で行う）。 */
        #app1-clip-slider-container {
            position: absolute;
            bottom: 20px;
            /* 時刻パネル（468px）＋隙間12px＋このパネル（296px）＝776px を中央に置いたときの位置。
               left の 120px は「時刻パネルの右端 − 画面中央」の固定値（時刻パネル側の
               -126px オフセットと対で決まる）。ここへ、このパネル自身の半幅を足す。 */
            left: 50%;
            /* ★ストリートビュー（👣）のボタンを地形断面の右に足したぶん、黒帯を
               56px（ボタン44px＋隙間12px）伸ばしてある。左端の位置は動かさずに右へ
               伸ばしたいので、増えた幅の半分（28px）だけ中心をずらす。 */
            transform: translateX(calc(-50% + 296px));
            width: 352px;
            background: rgba(15, 15, 25, 0.85);
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            z-index: 100000;
            box-sizing: border-box;
            display: none;      /* 時刻パネルと同じ理由（ポータル画面での映り込み防止） */
            align-items: center;
            gap: 12px;          /* 左端のアイコンとスライダーの間隔（時刻パネルと揃える） */
        }

        /* 2枚並べると 776px 必要になる。それも置けないほど狭い画面では、
           時刻パネルを中央に戻し、切り抜きパネルはツールバーの上へ回す
           （下から: 時刻パネル 20〜93px → ツールバー 100〜155px → ここ 163px〜）。 */
        @media (max-width: 800px) {
            #app1-time-slider-container {
                transform: translateX(-50%);
            }
            #app1-clip-slider-container {
                transform: translateX(-50%);
                bottom: 163px;
            }
        }

        /* ★追加：断面（30km東西縦断図）のオン・オフ。切り抜きスライダーパネルの中の
           3人目のボタンとして、他の物理ボタン（🌐ランプ等）と同じ並びに置く
           （以前は position:absolute でパネルの外に逃がして別の箱に見えていたが、
           普通の flex の子にして1枚の黒モーダルに merge した）。 */
        #app1-profile-toggle:disabled { cursor: default; }
        /* ツールチップの矢印がアイコンに重ならないよう、SVG は中央に置くだけにする */
        #app1-profile-toggle svg,
        #app1-streetview-toggle svg { display: block; }
        /* 黒帯の上で沈まないよう、少し明るい色にしておく（SVGなので currentColor が効く） */
        #app1-streetview-toggle { color: #e8eef8; }
        #app1-streetview-toggle.active { color: #ffd23c; }

        /* ラベルは中央基準で置かれてスライダーの左右にはみ出すので、その安全地帯を確保する */
        .slider-ui-inner.clip {
            margin: 0 24px;
        }
        .slider-ui-inner.clip .slider-labels-wrapper span {
            font-size: 12px;
        }
        #app1-clip-slider::-webkit-slider-thumb {
            background: #4fd1c5;                                  /* 地球モードのタイルに合わせた色 */
            box-shadow: 0 0 6px rgba(79, 209, 197, 0.55);
        }
        #app1-clip-slider::-webkit-slider-thumb:hover {
            background: #7fe6dd;
        }
        #app1-clip-ticks .tick {
            position: absolute;
            width: 1.5px;
            height: 8px;
            background: rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%);
        }
        /* 500m の先、全体表示の位置だけ太く・色を変えて「ここから先は別モード」と示す */
        #app1-clip-ticks .tick.full {
            width: 3px;
            height: 12px;
            background: #4fd1c5;
        }

        #app1-time-slider, #app1-clip-slider {
            width: calc(100% + 16px);
            margin-left: -8px;
            margin-right: -8px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent; 
            height: 16px;
            outline: none;
            position: relative;
            z-index: 2; 
            margin-top: 0;
            margin-bottom: 0;
        }
        
        /* つまみ（Thumb）のカスタマイズ */
        #app1-time-slider::-webkit-slider-thumb,
        #app1-clip-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;  
            height: 16px; 
            border-radius: 50%;
            background: #77aaff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(119,170,255,0.5);
            transition: background 0.2s, transform 0.1s;
            position: relative;
            z-index: 4; 
        }
        #app1-time-slider::-webkit-slider-thumb:hover {
            background: #aaccff;
            transform: scale(1.1);
        }

        .slider-ticks {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0;
            pointer-events: none;
            z-index: 3; 
            box-sizing: border-box;
        }
        
        /* 縦線（目盛り）のスタイル */
        #app1-slider-ticks .tick {
            position: absolute;
            width: 1.5px;           
            height: 8px;            
            background: rgba(255, 255, 255, 0.7); 
            transform: translate(-50%, -50%); 
        }

    /* ==========================================
       ★追加：スタートポータル画面＆ホームボタンのスタイル
       ======================================= */
    #portal-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #f3f4f6;
        z-index: 10000; /* Three.jsやiframeの最前面に被せる */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }

    #portal-title {
        font-size: 32px;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 48px;
        letter-spacing: 2px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    #portal-grid {
        display: grid;
        /* 横5列 × 縦2行（各タイル140px正方形） */
        grid-template-columns: repeat(5, 140px);
        grid-template-rows: repeat(2, 140px);
        gap: 20px;
    }

    /* 共通タイルスタイル */
    .portal-tile {
        background-color: #ffffff;
        border-radius: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        user-select: none;
        text-decoration: none;
        border: none;
        padding: 12px;
        box-sizing: border-box;
    }

    .portal-tile:hover {
        transform: translateY(-6px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
    }

    /* 3Dモデリング（2x2サイズ・左側ぶち抜き） */
    .tile-modeling {
        grid-column: 1 / 3;
        grid-row: 1 / 3;
        background: linear-gradient(135deg, #0052cc, #002d93); /* 深みのあるプレミアムブルー */
        color: #ffffff;
    }

    /* 鮮やかなゴールドオレンジのSVGペンアイコン */
    .tile-modeling .tile-icon-svg {
        width: 56px;
        height: 56px;
        margin-bottom: 8px;
        stroke: #ffa500;
        fill: none;
        filter: drop-shadow(0 0 10px rgba(255, 165, 0, 0.65)) drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .tile-modeling .tile-title {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 22px; 
        text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    /* 連携ミニアイコン配置エリア */
    .mini-icons-container {
        position: absolute;
        bottom: 22px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        width: 85%;
    }

    .mini-icon-node {
        position: relative;
        z-index: 2;
        width: 32px;
        height: 32px;
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px; 
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: all 0.2s ease;
    }

    .mini-icon-node:hover {
        background: rgba(255, 255, 255, 0.35);
        border-color: #ffd700;
        transform: scale(1.15);
    }

    /* マンセル値（1x1） */
    .tile-munsell {
        background: linear-gradient(135deg, #ff0055, #9900ff, #00ffcc);
        color: #ffffff;
    }

    .tile-munsell .tile-icon {
        font-size: 38px;
        margin-bottom: 6px;
    }

    .tile-munsell .tile-title {
        font-size: 14px;
        font-weight: bold;
    }

    /* 夜間景観（1x1）ディープネイビー×ゴールド */
    .tile-night {
        background: linear-gradient(135deg, #0a192f, #172a45);
        color: #ffd700;
    }

    .tile-night .tile-icon {
        font-size: 38px;
        margin-bottom: 6px;
    }

    .tile-night .tile-title {
        font-size: 14px;
        font-weight: bold;
        color: #ffffff;
    }

    /* 地球モード（1x1）深い藍×ターコイズ */
    .tile-earth {
        background: linear-gradient(135deg, #0b3d4f, #10707a);
        color: #ffffff;
    }

    .tile-earth .tile-icon {
        font-size: 38px;
        margin-bottom: 6px;
    }

    .tile-earth .tile-title {
        font-size: 14px;
        font-weight: bold;
    }

    /* Coming Soon タイル */
    .coming-soon {
        background-color: #e5e7eb;
        color: #9ca3af;
        opacity: 0.5;
        filter: grayscale(100%);
        cursor: default; /* 禁止マークを解除し、普通の矢印カーソルにします */
    }

    .coming-soon .tile-icon {
        font-size: 34px;
        margin-bottom: 6px;
    }

    .coming-soon .tile-title {
        font-size: 13px;
        font-weight: 500;
    }

    .coming-soon::after {
        content: "Coming Soon";
        position: absolute;
        bottom: 10px;
        font-size: 9px;
        background-color: rgba(0, 0, 0, 0.05);
        padding: 2px 8px;
        border-radius: 10px;
        color: #6b7280;
        font-weight: bold;
    }

    /* タイル内の微調整 */
    .tile-icon {
        line-height: 1;
    }
    .tile-title {
        text-align: center;
    }

    /* 地球モード中も下部パネルは出したままにする（切り抜きスライダーで操作を続けるため。
       パネルの z-index は iframe より前面なのでそのまま触れる）。
       ただし地球モードと同時には使えない「時刻」と「着色」は、触れないようにしておく。 */
    /* ==========================================================================
       ★追加：下部の操作バーは【どのアプリを開いていても 01 のものを出しっぱなし】にする。
       サブアプリ（02〜04）は全画面 iframe で重なるだけなので、バーは常に同じ位置に居る。
       そのとき使えない操作（別のシミュレーターのもの）は、半透明の膜で覆って無効化する。
       どれを覆うかは main.js の updateBottomBar が状態に応じて決める。
       ========================================================================== */
    .locked {
        pointer-events: none !important;
    }
    /* 既定はその要素をぴったり覆う（パネル全体を塞ぐときはこれで過不足ない） */
    .locked::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(10, 10, 18, 0.62);
        border-radius: 10px;   /* パネルの角丸と同じ */
        z-index: 5;
        pointer-events: none;
        /* ⚠️ .sim-panel-btn::after は【ツールチップ】に使われていて opacity:0 や
           transform・padding が入っている。🎨ボタンを塞ぐときはそれが効いてしまい
           膜が透明なまま・位置もずれるので、ここで打ち消しておく。 */
        opacity: 1;
        transform: none;
        padding: 0;
        box-shadow: none;
    }
    /* パネルの一部だけを塞ぐときは、その操作が占めている範囲にきっちり合わせる。
       数字はパネルの造り（縦 padding 14px・中身の高さ42px・🎨/⛰は44px角）から決めている。
        ・スライダー … 左右のラベル（陰影なし／夜間照明）が箱から 24px はみ出すので、
          margin と同じ 25px 広げてラベルごと覆う。上下はパネルの高さいっぱい。
        ・🎨/⛰ボタン … 上下はパネルの高さいっぱい、左右はボタンの縁に沿わせる。
          ⚠️ 上方向は -14px が実測の上限（パネル上端＝ボタン上端から 14.67px。
          これより大きく広げるとパネルの角丸の外に膜がはみ出す。実測で確認済み）。 */
    .locked.locked-slider::after {
        inset: -15px -25px -15px;
        border-radius: 8px;
    }
    .locked.locked-btn::after {
        inset: -14px -12px -11px;
        border-radius: 8px;
    }

    /* --- 親画面管理：フローティング「戻る」ボタン --- */
    #btn-back-to-portal {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10001; /* 全てのUI要素やiframe（z-index 5000）のさらに前面に配置 */
        background-color: #ffffff;
        color: #1f2937;
        border: 2px solid #1f2937;
        padding: 10px 18px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        display: none; /* 初期は非表示 */
        align-items: center;
        gap: 8px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #btn-back-to-portal:hover {
        background-color: #1f2937;
        color: #ffffff;
        transform: scale(1.04);
    }

/* ==========================================================================
       ★追加：ポータルタイル専用 カスタムツールチップ（ホバーテキスト位置微調整用）
       ========================================================================== */
    .portal-tile[data-portal-tooltip] {
        position: relative;
    }

    /* ツールチップの本体：指先と重ならないよう、やや右寄り(left: 60%)に配置 */
    .portal-tile[data-portal-tooltip]::after {
        content: attr(data-portal-tooltip);
        position: absolute;
        bottom: calc(100% + 14px); /* タイルの上側に配置 */
        left: 60%;                 /* 💡カーソルと重ならないよう、中央より右側に配置 */
        transform: translateX(-20%) translateY(8px); /* 出現時に下からフワッと浮き上がらせる */
        background-color: rgba(20, 20, 25, 0.95);
        color: #ffffff;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 10005;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ツールチップの小さな三角矢印 */
    .portal-tile[data-portal-tooltip]::before {
        content: "";
        position: absolute;
        bottom: calc(100% + 8px);
        left: 60%;
        transform: translateX(-50%) translateY(8px);
        border-width: 6px 6px 0 6px;
        border-style: solid;
        border-color: rgba(20, 20, 25, 0.95) transparent transparent transparent;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 10005;
    }

    /* ホバーした瞬間に位置をジャストに補正して綺麗に表示 */
    .portal-tile[data-portal-tooltip]:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translateX(-20%) translateY(0);
    }

    .portal-tile[data-portal-tooltip]:hover::before {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }

    </style>

</head>

            </svg>
        </button>
        <button id="btn-snap-toggle" class="toolbar-btn" onclick="window.toggleSnap()" data-tooltip="📏 スナップ: 500mm">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
        <span id="snap-val" style="font-size: 11px; font-weight: 900; line-height: 1;">500</span>
        <div style="display: flex; align-items: center; justify-content: space-between; width: 28px; margin-top: 2px; color: #555;">
            <div style="width: 1.5px; height: 6px; background: currentColor;"></div>
            <div style="flex-grow: 1; height: 1.5px; background: currentColor; position: relative;">
                <div style="position: absolute; left: 0; top: -2px; border-top: 2.5px solid transparent; border-bottom: 2.5px solid transparent; border-right: 3px solid currentColor;"></div>
                <div style="position: absolute; right: 0; top: -2px; border-top: 2.5px solid transparent; border-bottom: 2.5px solid transparent; border-left: 3px solid currentColor;"></div>
            </div>
            <div style="width: 1.5px; height: 6px; background: currentColor;"></div>
        </div>
    </div>
</button>
        <!-- ★追加：外構作図モード。建物を半透明にして、地盤面の上に
             芝生などの地面類・フェンスなどの囲い類・カーポートなどの外構類を作図する -->
        <button id="btn-exterior" class="toolbar-btn" onclick="window.toggleExterior()" data-tooltip="🌿 外構作図">
            <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; overflow: visible;">
                <!-- 地盤面 -->
                <line x1="2" y1="18" x2="22" y2="18" stroke="#6a9c4e" stroke-width="2" stroke-linecap="round" />
                <!-- 芝 -->
                <path d="M3.5 18 v-2 M6 18 v-2.6 M8.5 18 v-2" fill="none" stroke="#6a9c4e" stroke-width="1.2" stroke-linecap="round" />
                <!-- 建物（半透明のゴースト） -->
                <path d="M12 18 v-6 h6 v6" fill="rgba(0,122,204,0.12)" stroke="#9bbdd6" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M11 12 l4 -3.5 l4 3.5" fill="none" stroke="#9bbdd6" stroke-width="1.4" stroke-linejoin="round" />
                <!-- フェンス -->
                <path d="M2.5 18 v-5 M5.5 18 v-5 M8.5 18 v-5 M2 15 h7 M2 13.4 h7" fill="none" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" />
                <!-- 樹木 -->
                <circle cx="21" cy="12.5" r="2.6" fill="rgba(106,156,78,0.35)" stroke="#6a9c4e" stroke-width="1.2" />
                <line x1="21" y1="18" x2="21" y2="15" stroke="#8a6a49" stroke-width="1.3" stroke-linecap="round" />
            </svg>
        </button>

        <div class="toolbar-divider"></div>

        <button id="btn-undo" class="toolbar-btn disabled" onclick="undo()" data-tooltip="↺ 元に戻す">↺</button>
        <button id="btn-redo" class="toolbar-btn disabled" onclick="redo()" data-tooltip="↻ 進む">↻</button>
        <button id="btn-clear" class="toolbar-btn danger" onclick="clearAll()" data-tooltip="✖ すべて消去">✖</button>
        
        <div class="toolbar-divider"></div>
        <button id="btn-save-json" class="toolbar-btn" style="background:#f8f9fa; color:#333;" data-tooltip="💾 作業状態をセーブ">💾</button>
        <button id="btn-load-json" class="toolbar-btn" style="background:#f8f9fa; color:#333;" data-tooltip="📂 JSONからロード">📂</button>
        <input type="file" id="input-load-json" accept=".json" style="display: none;">

        <!-- ※ 地球モードの起動ボタンはここから撤去した。下部パネルの「切り抜き」スライダー
             （0 から動かすと起動）が入口になっている。 -->

        <div class="toolbar-divider"></div>
        <button id="btn-start-tutorial" class="toolbar-btn" style="background:#f8f9fa; color:#333;" data-tooltip="🎓 チュートリアル">🎓</button>
    </div>

    <div id="floating-menu"></div>

    <div id="tooltip"></div>

    <!-- ==========================================================================
         ★追加：外構作図モードの UI（ツールバーの「🌿 外構作図」で出入りする）
         中身は src/exterior/core/ui.js が組み立てる
         ========================================================================== -->
    <div class="ext-panel" id="ext-palette" style="display:none">
        <header><h1>外構の地物を選ぶ</h1><button class="ext-toggle">−</button></header>
        <div class="ext-body">
            <div id="ext-groups"></div>
            <div id="ext-items"></div>
            <div class="ext-btns">
                <button class="ext-act" id="ext-btn-cancel" style="display:none">作図をやめる</button>
                <button class="ext-act danger" id="ext-btn-clear">外構を全消去</button>
            </div>
            <button class="ext-act primary" id="ext-btn-exit">外構作図を終了</button>
        </div>
    </div>

    <div class="ext-panel" id="ext-inspector" style="display:none">
        <header><h1>編集</h1><button class="ext-toggle">−</button></header>
        <div class="ext-body" id="ext-edit"></div>
    </div>

    <div id="ext-hint" style="display:none"></div>
    <div id="ext-status" style="display:none"></div>


    <div id="app1-time-slider-container">
        <!-- どのシミュレーターに繋がるスライダーかを示す表示灯（ポータルのタイルと同じ絵柄）。
             夜間シミュレーターが動いている間ランプが点灯する。
             ★押すとスライダーごと切り替わる（オフなら 09:00 の位置へ、オンなら「陰影なし」へ）。
               スライダー自体の役割は今までどおりで、ボタンはその近道。 -->
        <button type="button" class="sim-panel-btn indicator" id="app1-night-lamp"
             data-tooltip="🌃 夜間景観モードにする">
            <span class="led-lamp"></span>🌃
        </button>
        <div class="slider-ui-inner" id="app1-time-slider-group">
            <!-- 幅を 0.9倍にしたので、文字が重なる 09:00 と 17:00 のラベルは省いた
                 （目盛りは1時間ごとに全部あるので位置は読める）。
                 ⚠️ 03_night-simulator の同じパネルとラベル構成を揃えること。 -->
            <div class="slider-labels-wrapper">
                <span style="left: 0%;">陰影なし</span>
                <span style="left: 40.91%;">12:00</span>
                <span style="left: 68.18%;">15:00</span>
                <span style="left: 100%;">夜間照明</span>
            </div>
            <div class="slider-wrapper">
                <div class="slider-rail-bg"></div>
                <input type="range" id="app1-time-slider" min="0" max="100" step="0.1" value="0">
                <div class="slider-ticks" id="app1-slider-ticks"></div>
            </div>
        </div>

        <button id="app1-munsell-btn" class="sim-panel-btn" data-tooltip="🎨 着色モードへ">
            <span class="led-lamp"></span>🎨
        </button>
    </div>

    <!-- ★追加：地球モードの「中心を切り抜く」大きさ。時刻スライダーとは別パネルにして、
         その右隣に並べる。0＝地球モードなし、50m以上に動かすと地球モードが起動する。
         値は 04 側の HUD スライダーと双方向で同期する。 -->
    <div id="app1-clip-slider-container">
        <!-- 地球モードが動いている間はランプが点灯する（時刻パネルの🌃と同じ作法）。
             ★押すとスライダーごと切り替わる（オフなら 50m へ、オンなら「地球なし」へ）。 -->
        <button type="button" class="sim-panel-btn indicator" id="app1-earth-lamp"
             data-tooltip="🌐 地球モードにする">
            <span class="led-lamp"></span>🌐
        </button>
        <div class="slider-ui-inner clip" id="app1-clip-slider-group">
            <div class="slider-labels-wrapper">
                <span style="left: 0%;">地球なし</span>
                <span style="left: 50%;" id="app1-clip-display"></span>
                <span style="left: 100%;">全体</span>
            </div>
            <div class="slider-wrapper">
                <div class="slider-rail-bg"></div>
                <!-- 刻みは 04 側の切り抜きスライダー（50〜500m・10m刻み）に合わせる。
                     0 だけが特別で「地球モードなし」。0 と 50 の間は 50 に吸い付く。
                     500m を超えたところにもう1段「全体表示」があり、そこへ動かすと
                     中間値を作らずカクッと最後まで飛ぶ（app1-clip-ticks の最後の目盛りが太いのが目印）。 -->
                <input type="range" id="app1-clip-slider" min="0" max="550" step="10" value="0">
                <div class="slider-ticks" id="app1-clip-ticks"></div>
            </div>
        </div>
        <!-- 東西30km断面のオン・オフ。地球モード中のみ押せる（それ以外は膜で塞ぐ）。
             アイコンは「山を水平に切って、切り口にハッチが掛かった」断面図の絵。 -->
        <button type="button" id="app1-profile-toggle" class="sim-panel-btn"
                data-tooltip="東西断面を表示する">
            <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false">
                <defs>
                    <pattern id="profIconHatch" width="3.4" height="3.4"
                             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <line x1="0" y1="0" x2="0" y2="3.4" stroke="currentColor" stroke-width="1.1" />
                    </pattern>
                    <clipPath id="profIconClip">
                        <path d="M2 19 L8.4 7 L12.4 12.6 L16.4 5 L22 19 Z" />
                    </clipPath>
                </defs>
                <!-- 切り口（水平線より下）のハッチ -->
                <g clip-path="url(#profIconClip)">
                    <rect x="0" y="12.6" width="24" height="7" fill="url(#profIconHatch)" />
                </g>
                <!-- 山の輪郭と、切った面の線 -->
                <path d="M2 19 L8.4 7 L12.4 12.6 L16.4 5 L22 19 Z"
                      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <line x1="1.2" y1="12.6" x2="22.8" y2="12.6" stroke="currentColor" stroke-width="1.7" />
            </svg>
        </button>
        <!-- ストリートビュー（道路に降りて歩く）。地形断面と同じく地球モード中だけ押せる。
             実体は 04 側の js/streetview.js。ここはボタンだけで、押すと iframe の
             toggleEarthStreetView を呼ぶ（app1-profile-toggle と同じ作法）。 -->
        <!-- アイコンは絵文字（👣）だと黒く潰れて黒帯に埋没するので、
             断面ボタンと同じく currentColor で描く SVG にして明るさを揃える。 -->
        <button type="button" id="app1-streetview-toggle" class="sim-panel-btn"
                data-tooltip="道路に降りて歩く">
            <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false">
                <!-- 左足（奥）-->
                <ellipse cx="8.2" cy="8.6" rx="3.0" ry="4.3" fill="currentColor"
                         transform="rotate(-12 8.2 8.6)" />
                <ellipse cx="6.6" cy="13.6" rx="1.25" ry="1.05" fill="currentColor" />
                <!-- 右足（手前）-->
                <ellipse cx="15.9" cy="14.6" rx="3.0" ry="4.3" fill="currentColor"
                         transform="rotate(10 15.9 14.6)" />
                <ellipse cx="17.6" cy="19.6" rx="1.25" ry="1.05" fill="currentColor" />
            </svg>
        </button>
    </div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
