name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # mainブランチにプッシュされたら実行

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. メインアプリのビルド
      - name: Build 01_building-builder
        run: |
          cd 01_building-builder
          npm install
          npm run build

      # 2. マンセルアプリのビルド
      - name: Build 02_munsell-simulator
        run: |
          cd 02_munsell-simulator
          npm install
          npm run build

      # 3. 夜間アプリのビルド
      - name: Build 03_night-simulator
        run: |
          cd 03_night-simulator
          npm install
          npm run build

      # 4. ビルド結果(dist)と地球シミュレーターを1つの公開用フォルダ(combined_dist)に合体させる
      - name: Assemble deployment folder
        run: |
          mkdir -p combined_dist
          cp -r 01_building-builder/dist/* combined_dist/

          mkdir -p combined_dist/munsell-api
          cp -r 02_munsell-simulator/dist/* combined_dist/munsell-api/

          mkdir -p combined_dist/night-api
          cp -r 03_night-simulator/dist/* combined_dist/night-api/

          # 🌐 地球シミュレーター（必要なファイルだけを安全にコピー）
          mkdir -p combined_dist/earth-api
          
          # index.html のコピー
          [ -f 04_earth-simulator/index.html ] && cp 04_earth-simulator/index.html combined_dist/earth-api/
          
          # js フォルダが存在すればコピー
          [ -d 04_earth-simulator/js ] && cp -r 04_earth-simulator/js combined_dist/earth-api/

          # データファイルの個別にコピー
          for file in mountain.geojson 建造物修景地区.json 自然風景保全地区.json 眺望規制面.json 眺望空間保全地域.json 伝統的建造物群保存地区.json 美観地区.json 風致地区.json 風致地区特別修景地域.json 歴史的風土特別保存地区.json 歴史的風土保存区域.json; do
            if [ -f "04_earth-simulator/$file" ]; then
              cp "04_earth-simulator/$file" combined_dist/earth-api/
            fi
          done

      # 4.5 地球シミュレーターの必須ファイルが揃っているか検証
      #     ⚠️ 上のコピーは [ -f ... ] で守っているので、どれか1つが欠けていても
      #     デプロイ自体は失敗しない（＝気づかないまま一部データが無いサイトが公開されてしまう）。
      #     ここで欠けを検出して明示的に失敗させ、静かな破損を防ぐ。
      - name: Verify earth-api files
        run: |
          missing=0
          for file in index.html js mountain.geojson 建造物修景地区.json 自然風景保全地区.json 眺望規制面.json 眺望空間保全地域.json 伝統的建造物群保存地区.json 美観地区.json 風致地区.json 風致地区特別修景地域.json 歴史的風土特別保存地区.json 歴史的風土保存区域.json; do
            if [ ! -e "combined_dist/earth-api/$file" ]; then
              echo "::error::地球シミュレーターに必須のファイルが見つかりません: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "combined_dist/earth-api の中身:"
            ls -la combined_dist/earth-api/
            exit 1
          fi
          echo "地球シミュレーターの必須ファイルはすべて揃っています。"

      # 5. GitHub Pagesへアップロード
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined_dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4