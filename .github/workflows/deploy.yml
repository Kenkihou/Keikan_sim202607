name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # mainブランチにプッシュされたら実行

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. メインアプリのビルド
      - name: Build 01_building-builder
        run: |
          cd 01_building-builder
          npm install
          npm run build

      # 2. マンセルアプリのビルド
      - name: Build 02_munsell-simulator
        run: |
          cd 02_munsell-simulator
          npm install
          npm run build

      # 3. 夜間アプリのビルド
      - name: Build 03_night-simulator
        run: |
          cd 03_night-simulator
          npm install
          npm run build

      # 4. ビルド結果(dist)と地球シミュレーターを1つの公開用フォルダ(combined_dist)に合体させる
      #    04 はビルド不要（importmap で CDN 直読み）なので、必要なファイルだけコピーする。
      - name: Assemble deployment folder
        run: |
          mkdir -p combined_dist
          cp -r 01_building-builder/dist/* combined_dist/

          mkdir -p combined_dist/munsell-api
          cp -r 02_munsell-simulator/dist/* combined_dist/munsell-api/

          mkdir -p combined_dist/night-api
          cp -r 03_night-simulator/dist/* combined_dist/night-api/

          # 🌐 地球シミュレーター（ビルド不要）。実行に要るのは index.html・js・変換済みJSON だけ。
          #    元データの 眺望shapeデータ(19MB) と Python スクリプトは配信しない。
          mkdir -p combined_dist/earth-api
          cp 04_earth-simulator/index.html combined_dist/earth-api/
          cp -r 04_earth-simulator/js combined_dist/earth-api/
          cp 04_earth-simulator/*.json combined_dist/earth-api/
          rm -f combined_dist/earth-api/settings.json

      # 5. GitHub Pagesへアップロード
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined_dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4