<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜間景観シミュレーター</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; }
        canvas { display: block; }

        /* 画面中央下のタイムスライダーUI */
        #time-slider-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ★追加：01のモデリング画面から呼ばれたときは、あちらの時刻パネルがこの真上に
           ぴったり重なる（寸法・位置が同一）。あちらは右隣に「切り抜き」パネル（240px＋
           隙間12px）を置くぶん 126px だけ左へずれているので、こちらも同じだけずらして
           重なりを保つ。ずらさないと、あちらのパネルの右側からこちらがはみ出して見える。
           ※ 単独起動（?from=portal / 直接開く）のときは中央のまま。 */
        body.embedded-modeling #time-slider-container {
            transform: translateX(calc(-50% - 126px));
        }
        @media (max-width: 800px) {
            body.embedded-modeling #time-slider-container {
                transform: translateX(-50%);
            }
        }

        /* ⚠️ このパネルの寸法は 01_building-builder の #app1-time-slider-container と
           【完全に一致させる】こと。モデリングから呼ばれたときはあちらのパネルが
           この真上に重なるため、片方だけ変えると背後からはみ出して見える。
           （幅は 01 側に地球モードのパネルを並べた際に 520→468px へ詰めてある） */
        #time-slider-container {
            width: auto;
            min-width: 468px;
            background: rgba(15, 15, 25, 0.85);
            padding: 14px 25px;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            z-index: 100000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 右端のダミーボタン。01 側の🎨ボタンと同じ間隔にする */
        #time-slider-container .sim-panel-btn {
            margin-left: 12px;
        }

        .slider-ui-inner {
            position: relative;
            flex-grow: 1;
            margin: 0 25px 0 25px;
        }

        /* パネル左端の表示灯。01 側と同じ見た目・同じ位置に置いて、重ねたときにずれないようにする
           （操作子は隣のスライダーなので、押せないようにしてある） */
        .sim-panel-btn.indicator {
            cursor: default;
            pointer-events: none;
        }

        .slider-labels-wrapper {
            position: relative;
            width: 100%;
            height: 18px; 
            margin-bottom: 8px; 
        }
        .slider-labels-wrapper span {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            white-space: nowrap;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 16px; 
            display: flex;
            align-items: center;
        }

        .slider-rail-bg {
            position: absolute;
            left: -8px;
            right: -8px;
            height: 4px; 
            background: #2a2a3a;
            border-radius: 2px;
            pointer-events: none;
            z-index: 1;
        }

        #time-slider {
            width: calc(100% + 16px);
            margin-left: -8px;
            margin-right: -8px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent; 
            height: 16px;
            outline: none;
            position: relative;
            z-index: 2; 
            margin-top: 0;
            margin-bottom: 0;
        }
        #time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;  
            height: 16px; 
            border-radius: 50%;
            background: #77aaff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(119,170,255,0.5);
            transition: background 0.2s, transform 0.1s;
            position: relative;
            z-index: 4; 
        }
        #time-slider::-webkit-slider-thumb:hover {
            background: #aaccff;
            transform: scale(1.1);
        }

        .slider-ticks {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0;
            pointer-events: none;
            z-index: 3; 
            box-sizing: border-box;
        }
        
        .tick {
            position: absolute;
            width: 1.5px;           
            height: 8px;            
            background: rgba(255, 255, 255, 0.7); 
            transform: translate(-50%, -50%); 
        }
        /* ==========================================================================
           ★追加：親アプリのダミーボタン用スタイル（index.htmlから移植）
           ========================================================================== */
        .sim-panel-btn {
            background: #4e4e5e;
            color: #ffffff;
            border: 1px solid #666677;
            border-bottom: 4px solid #7a7a8a; 
            width: 44px;
            height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6); 
            padding-top: 6px;
            box-sizing: border-box;
        }

        .led-lamp {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #111115; 
            border-radius: 50%;
            transition: all 0.1s ease;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.9);
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
</head>
<body>

<div id="time-slider-container">
    <!-- 01 のパネルと同じ位置に同じ表示灯を置く（重ねたときに中身までずれないように）。
         スライダーが 0 から動いている間はランプが点灯する。 -->
    <div class="sim-panel-btn indicator" id="night-lamp" aria-hidden="true">
        <span class="led-lamp"></span>🌃
    </div>
    <div class="slider-ui-inner">
        <!-- ⚠️ 01_building-builder の時刻パネルとラベル構成を揃えること（重ねて表示されるため）。
             幅を詰めた関係で 09:00 と 17:00 のラベルは省いてある（目盛りは全部ある）。 -->
        <div class="slider-labels-wrapper">
            <span style="left: 0%;">陰影なし</span>
            <span style="left: 40.91%;">12:00</span>
            <span style="left: 68.18%;">15:00</span>
            <span style="left: 100%;">夜間照明</span>
        </div>
        <div class="slider-wrapper">
            <div class="slider-rail-bg"></div>
            <input type="range" id="time-slider" min="0" max="100" step="0.1" value="0">
            <div class="slider-ticks" id="slider-ticks"></div>
        </div>
    </div>
    
    <button class="sim-panel-btn" disabled style="pointer-events: none; opacity: 0.4;">
        <span class="led-lamp"></span>🎨
    </button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module" src="/src/ys_main.js"></script>
<script>
    // ==========================================================================
    // ★追加：起動元（ポータルかモデリングか）を判定して「終了」ボタンを制御
    // ==========================================================================
    (function() {
        // 自分が呼ばれたときのURLパラメータを取得
        const urlParams = new URLSearchParams(window.location.search);
        // from=modeling 以外の時（つまりポータルからの起動時など）はボタンを消す
        const isFromModeling = urlParams.get('from') === 'modeling';
        
        // ※ 'btn-exit' は実際の「終了」ボタンのIDに合わせてください
        const exitBtn = document.getElementById('btn-exit');
        if (exitBtn) {
            exitBtn.style.display = isFromModeling ? 'block' : 'none';
        }

        // ★追加：左端の🌃ランプ。スライダーが 0 から動いている間だけ点灯させる
        //   （単独起動のときはこちらのパネルが操作子になるため。01 側も同じ挙動）。
        const slider = document.getElementById('time-slider');
        const lamp = document.getElementById('night-lamp');
        if (slider && lamp) {
            const syncLamp = () => lamp.classList.toggle('active', parseFloat(slider.value) > 0);
            slider.addEventListener('input', syncLamp);
            syncLamp();
        }

        // ★変更：親アプリ（01）の中で開かれているときは、下部の操作バーは【親のものだけ】を出す。
        //   親のバーは 01〜04 のどれを開いていても同じ位置に出っぱなしになっていて、
        //   このアプリの時刻スライダーもそこから操作される（setSimulationTime）。
        //   こちらの複製を残すと二重になり、わずかなズレも目立つので隠す。
        //   単独で直接開いたとき（親が居ないとき）だけ、こちらのパネルを使う。
        const embedded = window.parent && window.parent !== window;
        const panel = document.getElementById('time-slider-container');
        if (panel && embedded) {
            panel.style.display = 'none';
        }
        if (isFromModeling) {
            document.body.classList.add('embedded-modeling');
        }
    })();
</script>
</body>
</html>
